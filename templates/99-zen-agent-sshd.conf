# /etc/ssh/sshd_config.d/99-zen-agent.conf
#
# sshd Match block for the AI agent user. Restricts authentication,
# disables forwarding paths that could pivot through the host,
# and source-IP-restricts to the agent's known networks.
#
# IMPORTANT: validate before reloading sshd:
#   sudo sshd -t && sudo systemctl reload sshd
#
# A bad Match syntax causes sshd to refuse to start.

# --- Replace 'zen-agent' with your agent's username ---
# --- Replace address ranges with the agent host's actual networks ---

Match User zen-agent
    # Auth: only publickey, never password or kbd-interactive
    PasswordAuthentication no
    KbdInteractiveAuthentication no
    PubkeyAuthentication yes
    AuthenticationMethods publickey

    # Forwarding: disable every path that could pivot through this host
    AllowAgentForwarding no
    AllowTcpForwarding no
    X11Forwarding no
    PermitTunnel no
    GatewayPorts no

    # PTY: needed for sudo, systemctl, etc.
    PermitTTY yes

    # Idle timeout: long enough for a vzdump restore but not infinite
    ClientAliveInterval 300
    ClientAliveCountMax 3

# --- Optional: source-IP-restrict to known agent networks ---
# Multiple Match blocks for the same user are MERGED by sshd.
# Uncomment and adjust the network ranges for tighter security.
#
# Match User zen-agent Address 192.168.50.0/24,100.64.0.0/10
#     PasswordAuthentication no
#     KbdInteractiveAuthentication no
#     PubkeyAuthentication yes
#     AllowAgentForwarding no
#     AllowTcpForwarding no
#     X11Forwarding no
#     PermitTTY yes
