# /etc/ssh/sshd_config.d/99-zen-agent.conf
#
# sshd Match block for the AI agent user. Restricts authentication and
# disables forwarding paths that could pivot through the host.
#
# Source-IP restriction is NOT done here: a `Match ... Address` block only
# changes settings for matching clients and denies nobody else. Restrict the
# source on the key itself, in /home/zen-agent/.ssh/authorized_keys:
#   from="<agent-ip>",restrict,pty ssh-ed25519 AAAA... <comment>
# `restrict` turns off forwarding for that key; `pty` turns the terminal back on.
#
# IMPORTANT: validate before reloading sshd (as root):
#   sshd -t && systemctl reload ssh
#
# A bad Match syntax causes sshd to refuse to start.

# --- Replace 'zen-agent' with your agent's username ---

Match User zen-agent
    # Auth: only publickey, never password or kbd-interactive
    PasswordAuthentication no
    KbdInteractiveAuthentication no
    PubkeyAuthentication yes
    AuthenticationMethods publickey

    # Forwarding: disable every path that could pivot through this host
    AllowAgentForwarding no
    AllowTcpForwarding no
    X11Forwarding no
    PermitTunnel no
    GatewayPorts no

    # PTY: needed for sudo, systemctl, etc.
    PermitTTY yes

    # Idle timeout: long enough for a vzdump restore but not infinite
    ClientAliveInterval 300
    ClientAliveCountMax 3
